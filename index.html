<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hit on the Way: car test</title>
<style>
  :root {
    --bg: #0f1115; --panel: #1a1d24; --ink: #f2f3f5; --quiet: #9aa1ad;
    --accent: #ff7a45; --ok: #4cc38a; --bad: #ef5b5b; --line: #2b2f38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px 32px;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: var(--quiet); margin: 0 0 16px; font-size: 14px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--quiet); margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: #0b0d11; color: var(--ink); font-size: 16px;
  }
  button {
    width: 100%; padding: 14px; border: 0; border-radius: 12px; font-size: 17px; font-weight: 600;
    background: #2b2f38; color: var(--ink); margin-top: 10px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: #111; }
  button:disabled { opacity: .45; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .big {
    width: 180px; height: 180px; border-radius: 50%; margin: 8px auto; display: grid; place-items: center;
    font-size: 64px; background: var(--accent); color: #111; padding: 0;
  }
  .status { text-align: center; color: var(--quiet); font-size: 14px; min-height: 20px; }
  .err { color: var(--bad); font-size: 14px; white-space: pre-wrap; }
  .hidden { display: none !important; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; font-size: 15px; }
  .check input { width: 22px; height: 22px; flex: none; margin-top: 1px; }
  .reveal { font-size: 15px; line-height: 1.6; }
  code { background: #0b0d11; padding: 2px 6px; border-radius: 6px; font-size: 13px; word-break: break-all; }
  .seg { display: flex; background: #0b0d11; border-radius: 10px; padding: 4px; gap: 4px; }
  .seg button { margin: 0; padding: 10px; font-size: 15px; background: transparent; }
  .seg button.on { background: #2b2f38; }
</style>
</head>
<body>
<main>
  <h1>Hit on the Way</h1>
  <p class="sub">Car test: does the song title stay hidden?</p>

  <!-- Step 1: setup -->
  <section id="setup">
    <label for="clientId">Spotify app Client ID</label>
    <input id="clientId" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="paste from the Spotify developer dashboard">
    <p class="sub" style="margin-top:10px">Redirect URI to add in the dashboard:<br><code id="redirectShow"></code></p>
    <button class="primary" id="loginBtn">Sign in with Spotify</button>
    <div class="err" id="setupErr"></div>
  </section>

  <!-- Step 2: choose playlist and mode -->
  <section id="choose" class="hidden">
    <label for="playlist">Playlist</label>
    <select id="playlist"></select>
    <label style="margin-top:14px">Play through</label>
    <div class="seg" id="modeSeg">
      <button data-mode="app" class="on">Spotify app</button>
      <button data-mode="browser">This browser</button>
    </div>
    <p class="sub" id="modeHelp" style="margin-top:8px"></p>
    <label class="check"><input type="checkbox" id="skipIntro" checked> Start 30 seconds into each song</label>
    <button class="primary" id="loadBtn">Load songs</button>
    <div class="err" id="chooseErr"></div>
  </section>

  <!-- Step 3: blind player -->
  <section id="play" class="hidden">
    <div class="status" id="songCount"></div>
    <button class="big" id="playPause" aria-label="Play">&#9654;</button>
    <div class="status" id="status"></div>
    <button class="primary" id="nextBtn">Next song</button>
    <div class="row">
      <button id="revealBtn">Reveal (hold)</button>
      <button id="reconnectBtn">Reconnect</button>
    </div>
    <div class="reveal hidden" id="reveal"></div>
    <div class="err" id="playErr"></div>
  </section>

  <section id="checklist" class="hidden">
    <label>What to check in the car</label>
    <label class="check"><input type="checkbox"> Car screen: no song title or artist shown</label>
    <label class="check"><input type="checkbox"> iPhone lock screen stays off while this page is open</label>
    <label class="check"><input type="checkbox"> Pause and play work within about a second</label>
    <label class="check"><input type="checkbox"> Next song still works after 5 minutes paused</label>
    <label class="check"><input type="checkbox"> Song keeps playing when the screen is left on this page</label>
    <p class="sub">Try both "Spotify app" and "This browser" and note which leaks less.</p>
  </section>
</main>

<script>
(() => {
  const SCOPES = [
    'user-read-playback-state', 'user-modify-playback-state',
    'playlist-read-private', 'playlist-read-collaborative',
    'streaming', 'user-read-private', 'user-read-email'
  ].join(' ');
  const REDIRECT = location.origin + location.pathname;
  const API = 'https://api.spotify.com/v1';
  const $ = id => document.getElementById(id);

  const store = {
    get: k => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    del: k => { try { localStorage.removeItem(k); } catch {} },
  };

  let token = null, songs = [], played = new Set(), current = null;
  let mode = 'app', deviceId = null, sdkPlayer = null, playing = false, wakeLock = null;

  $('redirectShow').textContent = REDIRECT;
  const DEFAULT_CLIENT_ID = '5acdccad5a7544cbad21108f1e9b46fc';
  $('clientId').value = store.get('hotw_client_id') || DEFAULT_CLIENT_ID;

  // ---------- PKCE auth ----------
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const randomString = n => b64url(crypto.getRandomValues(new Uint8Array(n)));

  async function login() {
    const clientId = $('clientId').value.trim();
    if (!clientId) { $('setupErr').textContent = 'Paste the Client ID first.'; return; }
    store.set('hotw_client_id', clientId);
    const verifier = randomString(64);
    store.set('hotw_verifier', verifier);
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    const q = new URLSearchParams({
      client_id: clientId, response_type: 'code', redirect_uri: REDIRECT,
      code_challenge_method: 'S256', code_challenge: challenge, scope: SCOPES,
    });
    location.href = 'https://accounts.spotify.com/authorize?' + q;
  }

  async function tokenRequest(params) {
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(params),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.error || 'Sign-in failed');
    token = data.access_token;
    store.set('hotw_token', token);
    store.set('hotw_expires', String(Date.now() + (data.expires_in - 60) * 1000));
    if (data.refresh_token) store.set('hotw_refresh', data.refresh_token);
  }

  async function handleRedirect() {
    const q = new URLSearchParams(location.search);
    if (q.get('error')) { $('setupErr').textContent = 'Spotify said: ' + q.get('error'); return false; }
    const code = q.get('code');
    if (!code) return false;
    history.replaceState(null, '', REDIRECT);
    await tokenRequest({
      client_id: store.get('hotw_client_id'), grant_type: 'authorization_code',
      code, redirect_uri: REDIRECT, code_verifier: store.get('hotw_verifier'),
    });
    return true;
  }

  async function ensureToken() {
    if (token && Number(store.get('hotw_expires')) > Date.now()) return;
    const refresh = store.get('hotw_refresh');
    if (!refresh) throw new Error('Signed out. Reload and sign in again.');
    await tokenRequest({ client_id: store.get('hotw_client_id'), grant_type: 'refresh_token', refresh_token: refresh });
  }

  async function api(path, opts = {}) {
    await ensureToken();
    const res = await fetch(path.startsWith('http') ? path : API + path, {
      ...opts, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
    });
    if (res.status === 204 || res.status === 202) return null;
    const text = await res.text();
    const data = text ? JSON.parse(text) : null;
    if (!res.ok) throw new Error((data && data.error && data.error.message) || ('Spotify error ' + res.status));
    return data;
  }

  // ---------- playlists ----------
  async function loadPlaylists() {
    const sel = $('playlist');
    sel.innerHTML = '';
    let url = '/me/playlists?limit=50';
    while (url) {
      const page = await api(url);
      for (const p of page.items || []) {
        if (!p) continue;
        const o = document.createElement('option');
        o.value = p.id; o.textContent = p.name;
        sel.appendChild(o);
      }
      url = page.next;
    }
    const last = store.get('hotw_playlist');
    if (last) sel.value = last;
  }

  async function loadSongs(playlistId) {
    songs = []; played.clear();
    let url = `/playlists/${playlistId}/items?limit=50`;
    while (url) {
      const page = await api(url);
      for (const it of page.items || []) {
        const t = it && (it.item || it.track);
        if (!t || t.type !== 'track' || !t.uri || t.is_local) continue;
        songs.push({
          uri: t.uri, title: t.name,
          artists: (t.artists || []).map(a => a.name).join(', '),
          album: t.album ? t.album.name : '',
          year: t.album && t.album.release_date ? t.album.release_date.slice(0, 4) : '',
          duration: t.duration_ms || 0,
        });
      }
      url = page.next;
    }
    if (!songs.length) throw new Error('No playable songs found. Spotify only lets this app read playlists you own or collaborate on.');
  }

  // ---------- playback ----------
  async function findAppDevice() {
    const data = await api('/me/player/devices');
    const list = (data && data.devices) || [];
    const phone = list.find(d => d.type === 'Smartphone') || list.find(d => d.is_active) || list[0];
    if (!phone) throw new Error('No Spotify device found. Open the Spotify app on this iPhone, play any song for a second, pause it, then come back and tap Reconnect.');
    return phone.id;
  }

  function loadSdk() {
    return new Promise((resolve, reject) => {
      if (sdkPlayer && deviceId) return resolve(deviceId);
      window.onSpotifyWebPlaybackSDKReady = () => {
        sdkPlayer = new Spotify.Player({
          name: 'Hit on the Way', volume: 0.9,
          getOAuthToken: cb => ensureToken().then(() => cb(token)),
        });
        sdkPlayer.addListener('ready', ({ device_id }) => { deviceId = device_id; resolve(device_id); });
        sdkPlayer.addListener('initialization_error', e => reject(new Error(e.message)));
        sdkPlayer.addListener('authentication_error', e => reject(new Error(e.message)));
        sdkPlayer.addListener('account_error', e => reject(new Error('Premium needed: ' + e.message)));
        sdkPlayer.connect();
      };
      const s = document.createElement('script');
      s.src = 'https://sdk.scdn.co/spotify-player.js';
      s.onerror = () => reject(new Error('Could not load the Spotify player.'));
      document.head.appendChild(s);
    });
  }

  async function connect() {
    setStatus('Connecting to Spotify…');
    if (mode === 'app') deviceId = await findAppDevice();
    else {
      deviceId = await loadSdk();
      if (sdkPlayer.activateElement) await sdkPlayer.activateElement();
    }
    setStatus('Ready');
  }

  function pickSong() {
    if (played.size >= songs.length) played.clear();
    let s;
    do { s = songs[Math.floor(Math.random() * songs.length)]; } while (played.has(s.uri));
    played.add(s.uri);
    return s;
  }

  async function playNew() {
    clearErr();
    hideReveal();
    if (!deviceId) await connect();
    if (mode === 'browser' && sdkPlayer && sdkPlayer.activateElement) await sdkPlayer.activateElement();
    current = pickSong();
    const offset = $('skipIntro').checked && current.duration > 90000 ? 30000 : 0;
    await api(`/me/player/play?device_id=${encodeURIComponent(deviceId)}`, {
      method: 'PUT', body: JSON.stringify({ uris: [current.uri], position_ms: offset }),
    });
    setPlaying(true);
    $('songCount').textContent = `Song ${played.size} of ${songs.length}`;
  }

  async function togglePlay() {
    clearErr();
    if (!current) return playNew();
    const q = deviceId ? `?device_id=${encodeURIComponent(deviceId)}` : '';
    if (playing) { await api('/me/player/pause' + q, { method: 'PUT' }); setPlaying(false); }
    else { await api('/me/player/play' + q, { method: 'PUT' }); setPlaying(true); }
  }

  function setPlaying(on) {
    playing = on;
    const b = $('playPause');
    b.innerHTML = on ? '&#10074;&#10074;' : '&#9654;';
    b.setAttribute('aria-label', on ? 'Pause' : 'Play');
    setStatus(on ? 'Playing' : (current ? 'Paused' : 'Tap play to start'));
  }

  // ---------- reveal (hold 1 second, for checking only) ----------
  let holdTimer = null;
  function startHold() { holdTimer = setTimeout(showReveal, 1000); }
  function endHold() { clearTimeout(holdTimer); }
  function showReveal() {
    if (!current) return;
    const r = $('reveal');
    r.innerHTML = '';
    for (const [k, v] of [['Song', current.title], ['Artist', current.artists], ['Album', current.album], ['Year (Spotify)', current.year]]) {
      const line = document.createElement('div');
      line.textContent = `${k}: ${v}`;
      r.appendChild(line);
    }
    r.classList.remove('hidden');
  }
  function hideReveal() { $('reveal').classList.add('hidden'); }

  // ---------- screen awake ----------
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  // ---------- ui helpers ----------
  const setStatus = t => { $('status').textContent = t; };
  const clearErr = () => { $('playErr').textContent = ''; };
  const showErr = (id, e) => { $(id).textContent = e.message || String(e); };
  const guard = (fn, errId) => async (...a) => { try { await fn(...a); } catch (e) { showErr(errId, e); } };

  function setMode(m) {
    mode = m; deviceId = null;
    for (const b of $('modeSeg').children) b.classList.toggle('on', b.dataset.mode === m);
    $('modeHelp').textContent = m === 'app'
      ? 'Open the Spotify app once before starting so it shows up as a device. It then plays in the background.'
      : 'Plays inside Safari. Keep this page open and the screen on.';
  }

  $('loginBtn').onclick = guard(login, 'setupErr');
  for (const b of $('modeSeg').children) b.onclick = () => setMode(b.dataset.mode);
  $('loadBtn').onclick = guard(async () => {
    const id = $('playlist').value;
    store.set('hotw_playlist', id);
    $('loadBtn').disabled = true; $('loadBtn').textContent = 'Loading…';
    try { await loadSongs(id); } finally { $('loadBtn').disabled = false; $('loadBtn').textContent = 'Load songs'; }
    $('songCount').textContent = `${songs.length} songs loaded`;
    $('play').classList.remove('hidden');
    $('checklist').classList.remove('hidden');
    setPlaying(false);
    keepAwake();
  }, 'chooseErr');
  $('playPause').onclick = guard(async () => { keepAwake(); await togglePlay(); }, 'playErr');
  $('nextBtn').onclick = guard(async () => { keepAwake(); await playNew(); }, 'playErr');
  $('reconnectBtn').onclick = guard(async () => { deviceId = null; await connect(); }, 'playErr');
  const rb = $('revealBtn');
  rb.addEventListener('pointerdown', startHold);
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) rb.addEventListener(ev, endHold);

  // ---------- start ----------
  setMode('app');
  (async () => {
    try {
      const fresh = await handleRedirect();
      if (!fresh) {
        token = store.get('hotw_token');
        if (!store.get('hotw_refresh')) return;
      }
      await loadPlaylists();
      $('setup').classList.add('hidden');
      $('choose').classList.remove('hidden');
    } catch (e) { showErr('setupErr', e); }
  })();
})();
</script>
</body>
</html>
